name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify -Dgit.sha=${GITHUB_SHA::7} -Dgh.run=$GITHUB_RUN_ID
      - uses: actions/upload-artifact@v5
        with:
          name: chb-frontend
          path: target/*.jar
