spring.application.name=chb-frontend

# --- Databasetoegang: twee rollen, twee pools (zie build-instruction.md §5) ---
# chb_viewer: SELECT-only, gebruikt door alle publieke en alle lees-endpoints.
app.datasource.viewer.url=${CHB_DB_URL}
app.datasource.viewer.username=chb_viewer
app.datasource.viewer.password=${CHB_VIEWER_DB_PASSWORD}
app.datasource.viewer.driver-class-name=org.postgresql.Driver

# chb_editor: enkel gebruikt door beveiligde, schrijvende endpoints (na authenticatie).
app.datasource.editor.url=${CHB_DB_URL}
app.datasource.editor.username=chb_editor
app.datasource.editor.password=${CHB_EDITOR_DB_PASSWORD}
app.datasource.editor.driver-class-name=org.postgresql.Driver

# --- Office365 SSO via Microsoft Entra ID (OIDC) ---
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0

server.port=${PORT:8082}

# Achter nginx (SSL-terminatie): zonder dit bouwt Spring de OAuth2 redirect_uri (en elke andere
# absolute URL) op basis van het interne, onversleutelde request op tussen nginx en deze app —
# dus http:// in plaats van https://, wat Entra ID terecht weigert (AADSTS50011). "framework"
# laat Spring's ForwardedHeaderFilter de X-Forwarded-Proto/-Host/-Port-headers van nginx
# vertrouwen om schema/host/poort te reconstrueren.
server.forward-headers-strategy=framework

# GET /api/stops geeft ~50K GeoJSON-features terug (build-instruction.md-uitbreiding: clustering
# op de kaart) — compressie scheelt daar fors op de payload.
server.compression.enabled=true
server.compression.mime-types=application/json,application/geo+json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# --- HTTP-sessies in Postgres i.p.v. in-memory ---
# Zonder dit verliest elke app-herstart (deploy, herstart na crash) alle actieve sessies, en moet
# iedereen opnieuw door de Entra ID-loginflow — vandaar de "continuous logouts". Geconfigureerd
# via @EnableJdbcHttpSession op DataSourceConfig, niet via spring.session.*-properties: die
# properties worden in deze Boot 4.1-opstelling door niets gelezen (zie het commentaar op
# DataSourceConfig voor waarom). Tabellen (chb.spring_session/chb.spring_session_attributes)
# worden niet automatisch aangemaakt — zie db/spring_session_schema.sql, eenmalig manueel uit te
# voeren.
